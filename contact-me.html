<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Me</title>

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header>
      <h1></h1>
      <!-- Navigation Bar -->
      <nav>
        <ul>
          <li><a href="index.html">About Me</a></li>
          <li><a href="previous-work.html">Previous Work</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="contact-me.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="contact-section">
        <h2>Contact Me</h2>
        <p>If you would like to reach out, feel free to send me a message.</p>

        <div class="contact-card">
          <form id="contactForm">
            <div class="form-group">
              <label for="name">Name</label>
              <input type="text" id="name" placeholder="Your Name" />
            </div>

            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" placeholder="Your Email" />
            </div>

            <div class="form-group">
              <label for="message">Message</label>
              <textarea
                id="message"
                placeholder="Your Message"
                rows="5"
              ></textarea>
            </div>

            <button type="submit" class="contact-button">Send Message</button>
          </form>
          <p id="formResponse"></p>
        </div>
      </section>
    </main>

    <footer class="footer">2026 © Zainub Siddiqui • Personal Portfolio</footer>

    <!-- JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
